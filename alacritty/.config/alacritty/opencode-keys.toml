# Ctrl+Alt+Shift+\ → open.menu ("|" = shifted Backslash form)
[[keyboard.bindings]]
key = "Backslash"
mods = "Control|Alt|Shift"
chars = "\u001b[27;8;92~"

[[keyboard.bindings]]
key = "|"
mods = "Control|Alt|Shift"
chars = "\u001b[27;8;92~"

# --- Alt+Shift+* (mod 4) — tab unread / input select / tab.reopen ---
[[keyboard.bindings]]
key = "A"
mods = "Alt|Shift"
chars = "\u001b[27;4;97~"

[[keyboard.bindings]]
key = "B"
mods = "Alt|Shift"
chars = "\u001b[27;4;98~"

[[keyboard.bindings]]
key = "E"
mods = "Alt|Shift"
chars = "\u001b[27;4;101~"

[[keyboard.bindings]]
key = "F"
mods = "Alt|Shift"
chars = "\u001b[27;4;102~"

[[keyboard.bindings]]
key = "N"
mods = "Alt|Shift"
chars = "\u001b[27;4;110~"

[[keyboard.bindings]]
key = "P"
mods = "Alt|Shift"
chars = "\u001b[27;4;112~"

# Alt+Shift+= → session.tab.reopen (logical key "+" under Shift)
[[keyboard.bindings]]
key = "+"
mods = "Alt|Shift"
chars = "\u001b[27;4;61~"

[[keyboard.bindings]]
key = "Equals"
mods = "Alt|Shift"
chars = "\u001b[27;4;61~"

[[keyboard.bindings]]
key = 13
mods = "Alt|Shift"
chars = "\u001b[27;4;61~"

# --- leader remaps (not CSI; Alt alone → ESC+char inside tmux) ---
# Alt+\ → session.list  (= <leader>l)
[[keyboard.bindings]]
key = "Backslash"
mods = "Alt"
chars = "\u000fl"

# Alt+- → session.tab.close  (= <leader>w)
[[keyboard.bindings]]
key = "Minus"
mods = "Alt"
chars = "\u000fw"
