# OpenCode ↔ tmux extended-key passthrough (Alacritty outer).
#
# Versions checked: tmux 3.8 · opencode v2.3.2 · alacritty 0.13.2
#
# Stack:
#   Alacritty (~/.config/alacritty/opencode-keys.toml) injects CSI 27~
#   → tmux parses chord → OpenTUI requests modifyOtherKeys level 1
#   → pane_key_mode=Ext 1 collapses shifted chords → these binds re-inject CSI
#
# Root cause / TODO(opentui#1184): under tmux, OpenTUI does not speak kitty
# keyboard protocol and asks for Ext 1, which maps e.g.:
#   C-S-a → C-a (^A), C-M-S-c → C-c (^C), C-M-S-\ → C-\ (^\), M-S-n → M-n
# Remove this file (+ Alacritty peer) when OpenCode requests Ext 2.
#
# CSI (xterm form): \033[27;<mod>;<code>~
#   mod = 1 + Shift(1) + Alt(2) + Ctrl(4)  → C-S=6, M-S=4, C-M-S=8
#   letters: lowercase codepoints (97=a), not 65=A — OpenTUI bind match
#
# Sync peers:
#   ~/.config/alacritty/opencode-keys.toml  (same CSI bytes)
#   OpenCode cli.json keybinds             (which chords matter)
#
# Verify while opencode focused:
#   tmux display -p '#{pane_key_mode}'   # Ext 1 until upstream

# Outer Alacritty advertises Eneks so client CSI is recognised.
set -as terminal-features ",alacritty:extkeys"
# Forward extended keys; until app asks for mode 2, panes stay Ext 1.
set -s extended-keys always

# Ctrl+Shift (mod 6)
bind -n C-S-a send-keys Escape "[27;6;97~"
bind -n C-S-e send-keys Escape "[27;6;101~"
bind -n C-S-d send-keys Escape "[27;6;100~"
bind -n C-S-t send-keys Escape "[27;6;116~"
bind -n C-S-0 send-keys Escape "[27;6;48~"
# Ctrl+Alt+Shift (mod 8)
bind -n C-M-S-a send-keys Escape "[27;8;97~"
bind -n C-M-S-c send-keys Escape "[27;8;99~"
bind -n C-M-S-d send-keys Escape "[27;8;100~"
bind -n C-M-S-f send-keys Escape "[27;8;102~"
bind -n C-M-S-k send-keys Escape "[27;8;107~"
bind -n C-M-S-m send-keys Escape "[27;8;109~"
bind -n C-M-S-p send-keys Escape "[27;8;112~"
bind -n C-M-S-v send-keys Escape "[27;8;118~"
bind -n C-M-S-x send-keys Escape "[27;8;120~"
bind -n C-M-S-\\ send-keys Escape "[27;8;92~"
# Alt+Shift (mod 4)
bind -n M-S-a send-keys Escape "[27;4;97~"
bind -n M-S-b send-keys Escape "[27;4;98~"
bind -n M-S-e send-keys Escape "[27;4;101~"
bind -n M-S-f send-keys Escape "[27;4;102~"
bind -n M-S-n send-keys Escape "[27;4;110~"
bind -n M-S-p send-keys Escape "[27;4;112~"
bind -n M-S-= send-keys Escape "[27;4;61~"
