# Key injects for opencode behind tmux (alacritty → tmux → opencode).
#
# Versions checked: tmux 3.8 · opencode v2.3.2 · alacritty 0.13.2
#
# Why two strategies:
#   CSI 27~  — modified combos Alacritty won't send distinctly; inject xterm form.
#   leader   — Alt+char CSI is rewritten by tmux to ESC+char; map to <leader>…
#
# Leader in opencode cli.json is ctrl+o (\u000f).
# CSI form: \u001b[27;<mod>;<code>~
#   mod = 1 + Shift(1) + Alt(2) + Ctrl(4)
#   code for letters: unshifted (97=a), not 65=A — OpenTUI matches
#   ctrl+shift+a on lowercase name + shift flag.
#
# tmux peer: ~/.tmux/opencode-keys.conf — OpenTUI still requests modifyOtherKeys
# level 1 (Ext 1), which collapses C-S-* / C-M-S-* / M-S-*; that file's binds
# re-inject the same CSI. Remove both sides when opentui#1184 (Ext 2) lands.

# --- Ctrl+Shift+* (mod 6) — cli.json: palette, terminal, input.*, tab.reopen ---
[[keyboard.bindings]]
key = "A"
mods = "Control|Shift"
chars = "\u001b[27;6;97~"

[[keyboard.bindings]]
key = "E"
mods = "Control|Shift"
chars = "\u001b[27;6;101~"

[[keyboard.bindings]]
key = "D"
mods = "Control|Shift"
chars = "\u001b[27;6;100~"

[[keyboard.bindings]]
key = "T"
mods = "Control|Shift"
chars = "\u001b[27;6;116~"

[[keyboard.bindings]]
key = "0"
mods = "Control|Shift"
chars = "\u001b[27;6;48~"

