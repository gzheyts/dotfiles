mods = "Control|Alt|Shift"
chars = "\u001b[27;8;97~"

[[keyboard.bindings]]
key = "C"
mods = "Control|Alt|Shift"
chars = "\u001b[27;8;99~"

[[keyboard.bindings]]
key = "D"
mods = "Control|Alt|Shift"
chars = "\u001b[27;8;100~"

[[keyboard.bindings]]
key = "F"
mods = "Control|Alt|Shift"
chars = "\u001b[27;8;102~"

[[keyboard.bindings]]
key = "K"
mods = "Control|Alt|Shift"
chars = "\u001b[27;8;107~"

[[keyboard.bindings]]
key = "M"
mods = "Control|Alt|Shift"
chars = "\u001b[27;8;109~"

[[keyboard.bindings]]
key = "P"
mods = "Control|Alt|Shift"
